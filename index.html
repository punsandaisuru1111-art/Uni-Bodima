<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uni Bodima — Find Your Place. Feel at Home.</title>
  <meta name="description" content="Discover student-verified boarding houses and key money escrow trust near SLIIT Malabe Campus. Built for SLIIT students, lecturers, and boarding owners.">

  <!-- Immediate On-Screen Error Diagnostic Monitor -->
  <script>
    window.onerror = function(msg, url, line, col, err) {
      console.error("Uni Bodima Error:", msg, url, line, err);
      var errBox = document.getElementById('debug-box');
      if (!errBox) {
        errBox = document.createElement('div');
        errBox.id = 'debug-box';
        errBox.style = 'position:fixed;bottom:10px;left:10px;right:10px;background:#fff1f2;color:#be123c;border:2px solid #f43f5e;border-radius:12px;padding:16px;z-index:999999;font-family:monospace;font-size:12px;box-shadow:0 10px 25px rgba(0,0,0,0.2);';
        document.body.appendChild(errBox);
      }
      errBox.innerHTML += '<div><b>⚠️ Error:</b> ' + msg + ' in ' + (url ? url.split('/').pop() : 'script') + ' at line ' + line + '</div>';
    };
  </script>

  <!-- Local Core Stylesheet (Zero Network Requirement) -->
  <link rel="stylesheet" href="css/custom.css">

  <!-- 1. LOCAL ZERO-DEPENDENCY REACT ENGINE (Loaded locally, zero network requirement) -->
  <script src="js/react-lite.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 antialiased selection:bg-indigo-900 selection:text-white">

  <!-- React Application Mounting Target -->
  <div id="root">
    <!-- Initial Loading State -->
    <div class="min-h-screen flex flex-col items-center justify-center p-6 text-center space-y-4">
      <div class="w-16 h-16 rounded-3xl bg-indigo-900 flex items-center justify-center text-emerald-400 shadow-xl animate-pulse">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
      </div>
      <div>
        <h2 class="text-2xl font-black text-slate-900 tracking-tight">Uni<span class="text-emerald-600">Bodima</span></h2>
        <p class="text-xs font-semibold text-slate-500 mt-1">Find Your Place. Feel at Home near SLIIT Malabe...</p>
      </div>
    </div>
  </div>

  <!-- 2. Application Logic & Data Layers (All Local Files, Wrapped in Safe Scopes) -->
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/components.js"></script>
  <script src="js/modals.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/app.js"></script>

  <!-- 3. Optional Non-Blocking CDN Enhancements (Loaded after local app is already running) -->
  <script>
    // Asynchronously load Tailwind CSS without blocking local app
    (function() {
      var tw = document.createElement('script');
      tw.src = 'https://cdn.tailwindcss.com';
      tw.async = true;
      document.body.appendChild(tw);
    })();
  </script>

</body>
</html>
